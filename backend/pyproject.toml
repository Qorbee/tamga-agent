[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31",
    "boto3>=1.43.98",
    "circle-developer-controlled-wallets>=9.6.0",
    "fastapi>=0.141",
    "httpx>=0.28",
    "libarchive-c>=5.3",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "procrastinate>=3.9.0",
    "pydantic-ai-slim[ag-ui,openai]>=2.48.0",
    "pydantic-settings>=2.15",
    "pypdfium2>=5.13.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tnefparse>=1.4.0",
    "uvicorn[standard]>=0.53",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.98",
    "ipykernel>=7.3",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
# Supply-chain delay: never resolve a release younger than a week — compromised releases are usually
# caught within hours. Same rule as frontend/pnpm-workspace.yaml. The one sanctioned exception is a
# fix you need now (a security patch): exempt that package alone, with a comment and a removal date,
#   exclude-newer-package = { starlette = "0 days" }  # CVE-…; remove after YYYY-MM-DD
# and never by lowering or deleting this line.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ASYNC catches blocking calls in async code; S is bandit (security); B, SIM and UP catch bug-prone
# and outdated idioms.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101"]
"app/migrations/versions/**" = ["E501"]

[tool.mypy]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
# asyncpg ships no types (SQLAlchemy drives it everywhere else); platform/events.py only listens
# with it, and hands on the text of each note it hears.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# xlrd ships no types and has no stubs; documents/sheets.py turns what it reads into typed rows.
module = ["xlrd", "xlrd.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypdfium2 ships no types; documents/reading.py returns only text and counts from it.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# libarchive-c and tnefparse ship no types; documents/unpacking.py returns only names and bytes.
module = ["libarchive", "libarchive.*", "tnefparse", "tnefparse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Postgres from docker-compose.yml; runs when INTEGRATION=1",
]
