[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi>=0.141",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ipykernel>=7.3",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.uv]
# Supply-chain delay: never resolve a release younger than a week — compromised releases are usually
# caught within hours. Same rule as frontend/pnpm-workspace.yaml. The one sanctioned exception is a
# fix you need now (a security patch): exempt that package alone, with a comment and a removal date,
#   exclude-newer-package = { starlette = "0 days" }  # CVE-…; remove after YYYY-MM-DD
# and never by lowering or deleting this line.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ASYNC catches blocking calls in async code; S is bandit (security); B, SIM and UP catch bug-prone
# and outdated idioms.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101"]
"app/migrations/versions/**" = ["E501"]

[tool.mypy]
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Postgres and Redis from docker-compose.yml; runs when INTEGRATION=1",
]
