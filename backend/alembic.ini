# Alembic configuration. The database URL is not here: env.py reads it from app.config, the only
# place the environment is read.
#
#   uv run alembic revision --autogenerate -m "add orders"   # then REVIEW the generated file
#   uv run alembic upgrade head

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
# Date-prefixed, so `ls versions/` reads in the order revisions were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# Generated revisions come out already formatted, so they pass the same checks as hand-written code.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
