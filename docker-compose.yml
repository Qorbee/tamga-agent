# Local development infrastructure. Credentials are LOCAL ONLY and match backend/.env.example.
#
#   docker compose up -d                 # Postgres; run the backend with uv
#   docker compose --profile app up -d   # ...plus the backend image, to test the container
#
# This file is the one place the Postgres version is written: CI starts the same service from it.
# Background jobs run on this Postgres too (ADR-0001), so there is no Redis.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      # 18+ keeps its data in a per-major subdirectory (/var/lib/postgresql/18/docker), so the volume
      # is mounted one level up; mounting the old .../data path would start on an empty directory.
      # A major-version bump, or a volume made before 18, starts an empty cluster beside the old data,
      # which stays in the volume: dump and restore it, or `docker compose down -v` if nothing matters.
      - postgres_data:/var/lib/postgresql
    configs:
      # Runs once, on an empty volume. The test suite gets its own database so it can never write
      # to the one you develop against.
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    env_file:
      # Optional, so CI and fresh clones can start Postgres before anyone creates it.
      - path: backend/.env
        required: false
    environment:
      # Service names, not localhost: inside the compose network each service is its own host.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

configs:
  create-test-db:
    content: |
      CREATE DATABASE app_test;

volumes:
  postgres_data:
