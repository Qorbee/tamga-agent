# Local development infrastructure. Credentials are LOCAL ONLY and match backend/.env.example.
#
#   docker compose up -d                 # Postgres, file storage and the converter; run the backend
#                                        # with uv
#   docker compose --profile app up -d   # ...plus the backend, worker and web images
#
# This file is the one place the Postgres, SeaweedFS and Gotenberg versions are written: CI starts
# the same services from it.
# Background jobs run on this Postgres too (ADR-0001), so there is no Redis.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    # Loopback only: these credentials are local, and nothing else on the network should reach it.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18+ keeps its data in a per-major subdirectory (/var/lib/postgresql/18/docker), so the volume
      # is mounted one level up; mounting the old .../data path would start on an empty directory.
      # A major-version bump, or a volume made before 18, starts an empty cluster beside the old data,
      # which stays in the volume: dump and restore it, or `docker compose down -v` if nothing matters.
      - postgres_data:/var/lib/postgresql
    configs:
      # Runs once, on an empty volume. The test suite gets its own database so it can never write
      # to the one you develop against.
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage for local runs and CI; production uses Cloudflare R2 (ADR-0001).
  # It creates no bucket by itself: `curl -X PUT http://localhost:8333/tamga` once (the tests do
  # their own). With no identities configured it accepts any keys, which is fine on a laptop only.
  storage:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333"]
    # Loopback only: it accepts any keys.
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Word, RTF and OpenDocument files converted to PDF (ADR-0012): Gotenberg with LibreOffice only,
  # no Chromium. A file from outside is opened here, so it sits on a network with no route out and
  # every feature that fetches (download-from, webhooks, a document's linked content) is off: a
  # document cannot make it reach anything. The image is pinned by digest.
  converter:
    image: gotenberg/gotenberg:8.37.0-libreoffice@sha256:c85f019d6ae4927714507254331cc0ed72da7b619ee798e3a45de01f54372c12
    command:
      - gotenberg
      - --api-timeout=60s
      - --api-body-limit=50MB
      - --api-disable-download-from
      - --webhook-disable
      - --prometheus-disable-collect
      - --pdfengines-disable-routes
      - --libreoffice-deny-public-ips
      - --libreoffice-deny-private-ips
    networks: [converter]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A port on loopback for a worker run on the host (and the tests): a network with no route out
  # publishes none, so this relays it. It runs only scripts/converter-relay.py, never a document.
  converter-port:
    image: gotenberg/gotenberg:8.37.0-libreoffice@sha256:c85f019d6ae4927714507254331cc0ed72da7b619ee798e3a45de01f54372c12
    command: ["python3", "/relay.py"]
    configs:
      - source: converter-relay
        target: /relay.py
    networks: [default, converter]
    ports:
      - "127.0.0.1:${CONVERTER_PORT:-3100}:3000"
    depends_on:
      converter:
        condition: service_healthy

  backend:
    profiles: [app]
    build: ./backend
    env_file:
      # Optional, so CI and fresh clones can start Postgres before anyone creates it.
      - path: backend/.env
        required: false
    environment:
      # Service names, not localhost: inside the compose network each service is its own host.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      S3_ENDPOINT_URL: http://storage:8333
      # Presigned links are opened by the browser on the host, not inside the compose network.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${STORAGE_PORT:-8333}
      # The web service's origin as the browser sees it; without it the browser's calls are blocked.
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      # Where invite links send people.
      WEB_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  # The same image and settings as the backend, running jobs instead of serving requests.
  worker:
    profiles: [app]
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      S3_ENDPOINT_URL: http://storage:8333
      CONVERTER_URL: http://converter:3000
    # The one service besides the relay that reaches the converter: it sends the files.
    networks: [default, converter]
    # The executor's sign-in to Circle's CLI (ADR-0017): kept across new images, renewed by hand.
    volumes:
      - circle_session:/circle-session
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      converter:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ./frontend
      args:
        # Inlined into browser JavaScript at build time: the API as the browser reaches it, so the
        # host's port, not the compose service name.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

configs:
  create-test-db:
    content: |
      CREATE DATABASE app_test;
  converter-relay:
    file: ./scripts/converter-relay.py

networks:
  # No route out: what is on it reaches only what else is on it.
  converter:
    internal: true

volumes:
  postgres_data:
  storage_data:
  circle_session:
