# The deployment on the Hetzner server (docs/architecture/01, Deploy), laid over docker-compose.yml,
# which stays the one place the images and versions are written. deploy/README.md has the steps;
# from the repository root on the server:
#
#   docker compose -f docker-compose.yml -f deploy/compose.yml --env-file deploy/.env --profile app up -d --build
#
# What this changes from local: no port is published (Nginx Proxy Manager reaches web and api over
# its own network, and the server's other apps hold 5432 and 8000); files go to Cloudflare R2, so
# the local storage and the converter's loopback relay do not start; Postgres has a real password,
# and the apps sign in as `tamga`, no superuser (deploy/tamga roles); the schema is migrated before
# the api and the worker start; everything restarts on its own, within a memory cap of its own, so
# one that runs away cannot starve the server's other apps.

name: tamga

# The company's addresses, all from one domain in deploy/.env (DOMAIN): the web app on it and on
# play., the API on api.; and the database's, as the apps' role. backend/.env does not set them;
# a line it has is overridden here.
x-addresses: &addresses
  WEB_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
  CORS_ORIGINS: https://${DOMAIN},https://play.${DOMAIN}
  SESSION_COOKIE_DOMAIN: ${DOMAIN}
  DATABASE_URL: postgresql+asyncpg://tamga:${TAMGA_DB_PASSWORD:?set TAMGA_DB_PASSWORD in deploy/.env}@postgres:5432/app

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports: !reset []
    # The tests' database is a laptop's and CI's.
    configs: !reset []
    restart: unless-stopped
    mem_limit: 1g
    # Its log holds each statement tamga_readonly ran (deploy/tamga roles): kept short.
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # R2 in production (ADR-0001).
  storage:
    profiles: [local]

  # Its cap (1g) is in docker-compose.yml.
  converter:
    restart: unless-stopped

  # Only a worker run on the host needs it.
  converter-port:
    profiles: [local]

  # The schema, before anything that reads it: api and worker wait for it to finish.
  migrate:
    profiles: [app]
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    # It runs beside the containers still serving.
    mem_limit: 768m
    env_file:
      - path: backend/.env
    environment:
      <<: *addresses
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    env_file: !override
      - path: backend/.env
    # Local addresses reset: storage comes from backend/.env, CORS and invite links from DOMAIN.
    environment: !override
      <<: *addresses
    ports: !reset []
    networks: [default, proxy]
    restart: unless-stopped
    mem_limit: 768m
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  worker:
    env_file: !override
      - path: backend/.env
    environment: !override
      <<: *addresses
      CONVERTER_URL: http://converter:3000
    restart: unless-stopped
    # Documents are read in child processes, inside the same cap.
    mem_limit: 1536m
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      converter:
        condition: service_healthy

  web:
    build:
      args:
        # Inlined into the browser's JavaScript at build time: the API as the browser reaches it.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?set DOMAIN in deploy/.env}
    ports: !reset []
    networks: [default, proxy]
    restart: unless-stopped
    mem_limit: 512m

networks:
  # Nginx Proxy Manager's network, made by its own Compose project: NPM reaches web:3000 and
  # backend:8000 by name on it.
  proxy:
    name: ${NPM_NETWORK:?set NPM_NETWORK in deploy/.env}
    external: true
