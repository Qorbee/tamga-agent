# The same checks each package's AGENTS.md lists, as a merge gate. Stack-tolerant: the frontend jobs
# run only once frontend/package.json exists and call only the contract scripts (lint, typecheck,
# build, generate:api), so any framework that keeps the contract passes through. The contracts job
# runs once contracts/foundry.toml exists.
#
# Supply chain: every action is pinned to a full commit SHA (a tag can be moved to malicious code —
# the LiteLLM compromise of March 2026 began with a poisoned action). Dependabot proposes new SHAs
# after its 7-day cooldown. Versions of Postgres, Python and Node are read from the files that define
# them, never repeated here; so is Foundry's (contracts/.foundry-version).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, so a newly disclosed vulnerability in a pinned dependency surfaces

# Read-only token for every job; a job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      # Integration tests skip unless this is set. A tier that only ever skips is not coverage.
      INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image and version in docker-compose.yml; it also creates the app_test database.
      - name: Start Postgres
        working-directory: .
        run: docker compose up -d --wait
      # latest-known: the newest uv whose checksum this pinned action already ships.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --locked
      # libarchive-c binds the system's libarchive (ADR-0012), as the image installs it.
      - name: libarchive
        run: |
          ldconfig -p | grep -q 'libarchive\.so\.13' \
            || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends libarchive13t64; }
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      # Migrations build the schema the way production does, in a database of their own, and
      # `alembic check` fails when the models describe something no revision creates.
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migrations_check
        run: |
          docker compose exec -T postgres createdb -U postgres migrations_check
          uv run alembic upgrade head
          uv run alembic check
      # Includes test_openapi.py, which fails when backend/openapi.json is stale.
      - name: pytest
        run: uv run pytest -q

  detect:
    name: Detect stack slots
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.slots.outputs.frontend }}
      contracts: ${{ steps.slots.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: slots
        run: |
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "contracts=$([ -f contracts/foundry.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (API types, lint, types, build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version:` — pnpm comes from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # --frozen-lockfile installs exactly what is pinned; the release-age rule in
      # pnpm-workspace.yaml was already applied when the lockfile was written.
      - run: pnpm install --frozen-lockfile
      # Frameworks that render at build time read their public env vars during the build.
      - name: Prepare env
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      # `git status --porcelain` rather than `git diff`, which ignores a file that was never
      # committed. The pathspec is relative to this job's working directory.
      - name: Generated API types match backend/openapi.json
        run: |
          pnpm generate:api
          if [ -n "$(git status --porcelain -- src/lib/api-schema.d.ts)" ]; then
            git diff -- src/lib/api-schema.d.ts
            echo "::error::src/lib/api-schema.d.ts is stale or uncommitted. Run: pnpm generate:api"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  contracts:
    name: Contracts (format, build, tests, ABI)
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # forge-std and OpenZeppelin at their pinned commits; their own submodules are not needed.
          submodules: true
      # A submodule pin can be any commit: `forge install` stages the default branch's head unless
      # corrected. Each one must carry a stable release tag of its upstream: vX.Y.Z, nothing after it.
      - name: Libraries at release tags
        working-directory: .
        run: |
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r key path; do
            url="$(git config -f .gitmodules --get "${key%.path}.url")"
            sha="$(git rev-parse "HEAD:$path")"
            refs="$(git ls-remote --tags "$url")"
            tags="$(awk -v sha="$sha" '$1 == sha { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' <<<"$refs" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            if [ -z "$tags" ]; then
              echo "::error::$path is at $sha, which is not a stable release tag of $url"
              exit 1
            fi
            echo "$path: $sha = $(echo $tags)"
          done
      - id: foundry
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundry.outputs.version }}
        env:
          # The action installs the newest foundryup unless told otherwise; this holds the installer
          # to a release older than 7 days. The Foundry binaries are pinned by version above.
          FOUNDRYUP_VERSION: 0.0.8
      - run: forge fmt --check
      # foundry.toml denies warnings, so a compiler warning fails here.
      - run: forge build --sizes
      - run: forge test -vvv
      - name: ABI copies in backend/ match the contracts
        working-directory: .
        run: |
          scripts/export-abi.sh
          if [ -n "$(git status --porcelain -- backend/app/platform/abi)" ]; then
            git status --porcelain -- backend/app/platform/abi
            echo "::error::backend/app/platform/abi/ is stale or uncommitted. Run: scripts/export-abi.sh"
            exit 1
          fi

  audit:
    name: Known vulnerabilities in the lockfiles
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGENTS.md, skills and code comments are read by agents; a reviewer can't see these characters.
      - name: No hidden or bidi Unicode
        run: python3 scripts/find_hidden_unicode.py .
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
      # The 7-day delay keeps out fresh malicious releases; this catches the opposite failure — an
      # old pinned version with a published CVE. `uvx` ignores the project's exclude-newer, hence
      # the flag.
      - name: Python (pip-audit over backend/uv.lock)
        working-directory: backend
        run: |
          uv export --locked --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --exclude-newer "7 days" pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - if: needs.detect.outputs.frontend == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: JavaScript (pnpm audit over frontend/pnpm-lock.yaml)
        if: needs.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
